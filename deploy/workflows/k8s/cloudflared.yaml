# Hatchet reachable from outside the cluster, for the sandbox workers
# (api/src/workflows/sandbox.ts): a person's sandbox runs their workflows as
# a Hatchet worker and must reach the engine's gRPC port, which has no
# public address. A Cloudflare tunnel publishes two hostnames and nothing
# else; TLS ends at Cloudflare, the engine stays plaintext inside.
#
#   hatchet-<env>.mako.ai       → caddy:8080          (API + dashboard)
#   hatchet-grpc-<env>.mako.ai  → hatchet-engine:7070 (gRPC over h2c)
#
# Hatchet's own auth is the wall (tenant tokens, the admin password), the
# same as any Hatchet Cloud endpoint. The in-cluster worker keeps the private
# service (HATCHET_WORKER_HOST_PORT); only tokens' broadcast addresses change
# (hatchet-values.yaml: serverUrl, grpcBroadcastAddress).
#
# provision.sh creates the tunnel, routes the hostnames, writes its token to
# the `cloudflared` Secret, and applies this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: hatchet
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.3.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared
                  key: token
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
